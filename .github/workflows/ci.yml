name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: snippycode
          POSTGRES_PASSWORD: snippycode
          POSTGRES_DB: snippycode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U snippycode -d snippycode_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway database for the HTTP and feature tests.
      TEST_DATABASE_URL: postgres://snippycode:snippycode@localhost:5432/snippycode_test
      # Some test files import the models before pointing them at the test DB
      DATABASE_URL: postgres://snippycode:snippycode@localhost:5432/snippycode_test
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      # bubblewrap for sandboxed runs; shellcheck for the lint and agent checks
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y bubblewrap shellcheck

      - name: Install server dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check agent scripts
        run: |
          bash -n agent/install.sh
          bash -n agent/snippycode-agent.sh
          shellcheck -S warning agent/install.sh agent/snippycode-agent.sh

      - name: Build (tsc + client)
        run: npm run build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile (errors only)
        run: docker run --rm -i hadolint/hadolint:latest-alpine hadolint --failure-threshold error - < Dockerfile

      - name: Validate docker-compose.yml
        env:
          SESSION_SECRET: ci-placeholder
        run: docker compose -f docker-compose.yml config --quiet

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: snippycode:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci
