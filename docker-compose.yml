version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: snippycode-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-snippycode}
      POSTGRES_USER: ${POSTGRES_USER:-snippycode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-db-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-snippycode} -d ${POSTGRES_DB:-snippycode}'
        ]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  snippycode:
    image: ${SNIPPYCODE_IMAGE:-ghcr.io/nerdy-technician/snippycode:latest}
    build:
      context: .
    container_name: snippycode
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://${POSTGRES_USER:-snippycode}:${POSTGRES_PASSWORD:-change-this-db-password}@postgres:5432/${POSTGRES_DB:-snippycode}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET before starting}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO_OWNER: ${GITHUB_REPO_OWNER:-}
      GITHUB_REPO_NAME: ${GITHUB_REPO_NAME:-}
      GITHUB_REPO_BRANCH: ${GITHUB_REPO_BRANCH:-main}
      GITHUB_SNIPPETS_PATH: ${GITHUB_SNIPPETS_PATH:-snippets}
      SNIPPET_RUN_ENABLED: ${SNIPPET_RUN_ENABLED:-false}
      SNIPPET_RUN_TIMEOUT_MS: ${SNIPPET_RUN_TIMEOUT_MS:-15000}
    volumes:
      - snippycode-data:/app/data
    ports:
      - '${SNIPPYCODE_PORT:-5000}:5000'
    restart: unless-stopped

  postgres-backup:
    image: postgres:16-alpine
    container_name: snippycode-postgres-backup
    profiles:
      - backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-this-db-password}
    volumes:
      - postgres-backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /backups
        pg_dump -h postgres -U ${POSTGRES_USER:-snippycode} ${POSTGRES_DB:-snippycode} > /backups/snippycode-$$(date +%Y%m%d-%H%M%S).sql

volumes:
  postgres-data:
  snippycode-data:
  postgres-backups:
